<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Logo Gazza Music Festival GMF</title>
  <desc id="desc">Logo GMF Applausometro giallo e nero</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0903"/>
      <stop offset="1" stop-color="#1d1600"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" rx="38" fill="url(#bg)"/>
  <rect x="18" y="18" width="604" height="324" rx="30" fill="none" stroke="#ffcc00" stroke-opacity="0.85" stroke-width="8"/>
  <g fill="#ffcc00" filter="url(#glow)" font-family="Arial Black, Impact, system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="92" font-size="28" letter-spacing="8">GAZZA MUSIC FESTIVAL</text>
    <text x="320" y="205" font-size="122" letter-spacing="6">GMF</text>
    <text x="320" y="282" font-size="52" letter-spacing="5">APPLAUSOMETRO</text>
  </g>
</svg>
